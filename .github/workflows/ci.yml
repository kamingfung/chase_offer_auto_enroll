name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        name: Lint, Format & Test
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [18, 20]

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npx prettier --check "*.js" "*.json" "*.html" "*.css" "scripts/**/*.js" "tests/**/*.js"

            - name: Lint
              run: npx eslint *.js scripts/**/*.js tests/**/*.js

            - name: Run tests
              run: npx jest --ci --coverage

            - name: Validate manifest
              run: node scripts/validate-manifest.js

    secrets:
        name: Secret Scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0

            - name: Gitleaks scan
              uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    package:
        name: Package Extension
        runs-on: ubuntu-latest
        needs: [check, secrets]
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Build zip artifact
              run: |
                  version=$(node -p "require('./manifest.json').version")
                  zip -r "chase-offer-adder-v${version}.zip" \
                    manifest.json popup.html popup.js popup.css images/ \
                    -x "*.DS_Store"

            - name: Upload artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: extension-package
                  path: chase-offer-adder-v*.zip
                  retention-days: 30
